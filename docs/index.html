<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Search Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1f2320;
    --muted: #6b7268;
    --line: #e6e3dd;
    --accent: #2f5233;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .day-group { margin-bottom: 32px; }
  .day-label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .job-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .job-title { font-weight: 600; font-size: 1.02rem; }
  .job-meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 10px; }
  .job-meta a { color: var(--accent); }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 500;
    margin-top: 6px;
  }
  .cover-letter {
    white-space: pre-wrap;
    font-size: 0.88rem;
    line-height: 1.5;
    background: #f5f4f1;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .adapted-cv {
    white-space: pre-wrap;
    font-size: 0.88rem;
    line-height: 1.5;
    background: #f5f4f1;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .copy-btn {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .copy-btn:hover { border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <h1>Daily Job Search</h1>
  <div class="sub">Paralegal / legal vacancies — auto-refreshed daily</div>
  <div id="root"><div class="empty">Loading…</div></div>

<script>
async function load() {
  const root = document.getElementById('root');
  try {
    const res = await fetch('data.json?_=' + Date.now());
    const history = await res.json();
    if (!history.length) {
      root.innerHTML = '<div class="empty">No runs yet.</div>';
      return;
    }
    root.innerHTML = history.map(day => `
      <div class="day-group">
        <div class="day-label">${day.date} — ${day.jobs.length} new</div>
        ${day.jobs.length === 0
          ? '<div class="empty">No new matching vacancies today.</div>'
          : day.jobs.map(jobCard).join('')}
      </div>
    `).join('');
  } catch (e) {
    root.innerHTML = '<div class="empty">No data yet — the first automated run will populate this.</div>';
  }
}

function jobCard(job) {
  const cardId = Math.random().toString(36).slice(2);
  const hasAdaptedCv = !!(job.adapted_cv && job.adapted_cv.trim());
  return `
    <div class="job-card">
      <div class="job-title">${escapeHtml(job.title || '')}</div>
      <div class="job-meta">${escapeHtml(job.employer || '')} · ${escapeHtml(job.location || '')}${job.salary ? ' · ' + escapeHtml(job.salary) : ''} · <a href="${job.url}" target="_blank">View listing</a></div>
      <details>
        <summary>Cover letter (ready to send)</summary>
        <div class="cover-letter" id="cl-${cardId}">${escapeHtml(job.cover_letter || '')}</div>
        <button class="copy-btn" data-copy-target="cl-${cardId}">Copy cover letter</button>
      </details>
      ${hasAdaptedCv ? `
      <details>
        <summary>CV adapted for this role</summary>
        <div class="adapted-cv" id="cv-${cardId}">${escapeHtml(job.adapted_cv)}</div>
        <button class="copy-btn" data-copy-target="cv-${cardId}">Copy adapted CV</button>
      </details>` : ''}
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const target = document.getElementById(btn.dataset.copyTarget);
  if (!target) return;
  navigator.clipboard.writeText(target.textContent).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});

load();
</script>
</body>
</html>
