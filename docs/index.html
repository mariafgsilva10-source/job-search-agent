<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Search Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1f2320;
    --muted: #6b7268;
    --line: #e6e3dd;
    --accent: #2f5233;
    --cv-accent: #791e3f;
    --cv-line: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .day-group { margin-bottom: 32px; }
  .day-label {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .job-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .job-title { font-weight: 600; font-size: 1.02rem; }
  .job-meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 10px; }
  .job-meta a { color: var(--accent); }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 0.88rem;
    font-weight: 500;
    margin-top: 6px;
  }
  .cover-letter {
    white-space: pre-wrap;
    font-size: 0.88rem;
    line-height: 1.5;
    background: #f5f4f1;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .copy-btn {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--accent);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
  }
  .copy-btn:hover { border-color: var(--accent); }
  .pdf-btn { font-weight: 500; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }

  /* --- CV preview: matches Maria's CV template --- */
  .cv-preview {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px 22px;
    margin-top: 8px;
    color: #262626;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .cv-name {
    text-align: center;
    color: var(--cv-accent);
    font-weight: 700;
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .cv-contact {
    text-align: center;
    font-size: 0.72rem;
    color: #333;
    margin-bottom: 10px;
  }
  .cv-rule {
    border: none;
    border-top: 1.5px solid var(--cv-line);
    margin: 0 0 12px;
  }
  .cv-summary { margin-bottom: 14px; }
  .cv-heading {
    color: var(--cv-accent);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    border-bottom: 1.5px solid var(--cv-line);
    padding-bottom: 3px;
    margin: 16px 0 8px;
  }
  .cv-entry { margin-bottom: 10px; }
  .cv-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-weight: 700;
  }
  .cv-row .cv-sub { font-weight: 400; }
  .cv-row .cv-dateline { white-space: nowrap; font-weight: 700; }
  .cv-role { font-weight: 700; margin-top: 1px; }
  .cv-entry ul { margin: 4px 0 0 18px; padding: 0; }
  .cv-entry li { margin-bottom: 2px; }
  .cv-skill-label { font-weight: 700; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <h1>Daily Job Search</h1>
  <div class="sub">Paralegal / legal vacancies — auto-refreshed daily</div>
  <div id="root"><div class="empty">Loading…</div></div>

<script>
async function load() {
  const root = document.getElementById('root');
  try {
    const res = await fetch('data.json?_=' + Date.now());
    const history = await res.json();
    if (!history.length) {
      root.innerHTML = '<div class="empty">No runs yet.</div>';
      return;
    }
    root.innerHTML = history.map(day => `
      <div class="day-group">
        <div class="day-label">${day.date} — ${day.jobs.length} new</div>
        ${day.jobs.length === 0
          ? '<div class="empty">No new matching vacancies today.</div>'
          : day.jobs.map(jobCard).join('')}
      </div>
    `).join('');
  } catch (e) {
    root.innerHTML = '<div class="empty">No data yet — the first automated run will populate this.</div>';
  }
}

function jobCard(job) {
  const cardId = Math.random().toString(36).slice(2);
  const cv = job.adapted_cv;
  const hasCv = !!(cv && typeof cv === 'object' && (cv.summary || (cv.experience || []).length));
  const hasLegacyCv = !!(cv && typeof cv === 'string' && cv.trim());
  return `
    <div class="job-card">
      <div class="job-title">${escapeHtml(job.title || '')}</div>
      <div class="job-meta">${escapeHtml(job.employer || '')} · ${escapeHtml(job.location || '')}${job.salary ? ' · ' + escapeHtml(job.salary) : ''} · <a href="${job.url}" target="_blank">View listing</a></div>
      <details>
        <summary>Cover letter (ready to send)</summary>
        <div class="cover-letter" id="cl-${cardId}">${escapeHtml(job.cover_letter || '')}</div>
        <div class="btn-row">
          <button class="copy-btn" data-copy-target="cl-${cardId}">Copy cover letter</button>
          ${job.cover_letter_pdf ? `<a class="copy-btn pdf-btn" href="${job.cover_letter_pdf}" target="_blank">Download PDF</a>` : ''}
        </div>
      </details>
      ${hasCv ? `
      <details>
        <summary>CV adapted for this role</summary>
        <div class="cv-preview" id="cv-${cardId}">${renderCv(cv)}</div>
        <div class="btn-row">
          <button class="copy-btn" data-copy-plain="cv-plain-${cardId}">Copy CV text</button>
          ${job.cv_pdf ? `<a class="copy-btn pdf-btn" href="${job.cv_pdf}" target="_blank">Download PDF</a>` : ''}
        </div>
        <textarea id="cv-plain-${cardId}" hidden>${escapeHtml(plainCvText(cv))}</textarea>
      </details>` : ''}
      ${hasLegacyCv ? `
      <details>
        <summary>CV adapted for this role</summary>
        <div class="cover-letter" id="cv-${cardId}">${escapeHtml(cv)}</div>
        <div class="btn-row">
          <button class="copy-btn" data-copy-target="cv-${cardId}">Copy adapted CV</button>
          ${job.cv_pdf ? `<a class="copy-btn pdf-btn" href="${job.cv_pdf}" target="_blank">Download PDF</a>` : ''}
        </div>
      </details>` : ''}
    </div>
  `;
}

function renderCv(cv) {
  const section = (heading, entries, kind) => {
    if (!entries || !entries.length) return '';
    return `
      <div class="cv-heading">${escapeHtml(heading)}</div>
      ${entries.map(e => entryHtml(e, kind)).join('')}
    `;
  };

  const skillsHtml = (cv.skills || []).length ? `
      <div class="cv-heading">SKILLS</div>
      <ul>
        ${cv.skills.map(s => `<li><span class="cv-skill-label">${escapeHtml(s.label || '')}:</span> ${escapeHtml(s.text || '')}</li>`).join('')}
      </ul>
  ` : '';

  return `
    <div class="cv-name">${escapeHtml(cv.name || '')}</div>
    <div class="cv-contact">${escapeHtml(cv.contact || '')}</div>
    <hr class="cv-rule">
    ${cv.summary ? `<div class="cv-summary">${escapeHtml(cv.summary)}</div>` : ''}
    ${section('EDUCATION', cv.education, 'education')}
    ${section('EXPERIENCE', cv.experience, 'experience')}
    ${skillsHtml}
  `;
}

function entryHtml(e, kind) {
  const bullets = (e.bullets || []).map(b => `<li>${escapeHtml(b)}</li>`).join('');
  if (kind === 'education') {
    return `
      <div class="cv-entry">
        <div class="cv-row"><span>${escapeHtml(e.title || '')}</span><span class="cv-dateline">${escapeHtml(e.dateline || '')}</span></div>
        <div class="cv-sub">${escapeHtml(e.institution || '')}</div>
        <ul>${bullets}</ul>
      </div>
    `;
  }
  return `
    <div class="cv-entry">
      <div class="cv-row"><span>${escapeHtml(e.employer || '')}${e.location ? ' · ' + escapeHtml(e.location) : ''}</span><span class="cv-dateline">${escapeHtml(e.dateline || '')}</span></div>
      <div class="cv-role">${escapeHtml(e.role || '')}</div>
      <ul>${bullets}</ul>
    </div>
  `;
}

function plainCvText(cv) {
  const lines = [];
  lines.push(cv.name || '');
  lines.push(cv.contact || '');
  lines.push('');
  if (cv.summary) { lines.push(cv.summary); lines.push(''); }
  if ((cv.education || []).length) {
    lines.push('EDUCATION');
    cv.education.forEach(e => {
      lines.push(`${e.title || ''}`);
      lines.push(`${e.institution || ''}${e.dateline ? '   ' + e.dateline : ''}`);
      (e.bullets || []).forEach(b => lines.push(`- ${b}`));
      lines.push('');
    });
  }
  if ((cv.experience || []).length) {
    lines.push('EXPERIENCE');
    cv.experience.forEach(e => {
      lines.push(`${e.employer || ''}${e.location ? ' · ' + e.location : ''}${e.dateline ? '   ' + e.dateline : ''}`);
      lines.push(`${e.role || ''}`);
      (e.bullets || []).forEach(b => lines.push(`- ${b}`));
      lines.push('');
    });
  }
  if ((cv.skills || []).length) {
    lines.push('SKILLS');
    cv.skills.forEach(s => lines.push(`${s.label || ''}: ${s.text || ''}`));
  }
  return lines.join('\n').trim();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  let text;
  if (btn.dataset.copyTarget) {
    text = document.getElementById(btn.dataset.copyTarget).textContent;
  } else if (btn.dataset.copyPlain) {
    text = document.getElementById(btn.dataset.copyPlain).value;
  }
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});

load();
</script>
</body>
</html>
