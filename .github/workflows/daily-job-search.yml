name: Daily Job Search

on:
  schedule:
    # 07:00 UK time (adjust for BST/GMT drift as needed - GitHub cron is UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic reportlab

      - name: Fetch new jobs
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Draft cover letters + CV suggestions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/draft_materials.py

      - name: Generate PDF cover letters + CVs
        run: python scripts/generate_pdfs.py

      - name: Commit dashboard update
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json docs/data.json docs/pdfs
          git diff --staged --quiet || git commit -m "Daily job search update $(date -u +%Y-%m-%d)"
          git push
